[project]
name = "fiesta-plus"
version = "0.0.1"
description = "New generation of social network for helping international students - used by sections of Erasmus Student Network."
authors = [{ name = "ESN VUT BRNO" }]
requires-python = ">=3.12"
dependencies = [
    "Django>=4.2,<5",
    "Pillow>=10.1.0,<11",
    "bcrypt>=3.2.0,<4",
    # 0.55.0 not compatible with allauth-cas
    "django-allauth==0.54.0",
    # support for dj4.0
    "django-allauth-cas @ git+https://github.com/thejoeejoee/django-allauth-cas@master",
    "django-click>=2.3.0,<3",
    "django-configurations>=2.4.2,<3",
    "django-countries>=7.2.1,<8",
    "django-extensions>=3.1.5,<4",
    "django-filter>=21.1,<22",
    "django-htmx>=1.14.0,<2",
    "django-lifecycle>=1.0.0,<2",
    "django-loginas>=0.3.10,<1",
    "django-model-path-converter>=0.1.0,<1",
    "django-polymorphic>=3.1.0,<4",
    "django-tables2>=2.5.3,<3",
    "django-webpack-loader>=3.1.1,<4",
    "elasticsearch>=7.17.0,<8",
    "factory-boy>=3.2.1,<4",
    "faker-education>=1.2,<2",
    "mysqlclient>=2.1.0,<3",
    "psycopg2-binary>=2.9.3,<3",
    "python-magic>=0.4.25,<1",
    "tablib[xlsx]>=3.2.1,<4",
    "django-select2>=7.10.0,<8",
    "django-debug-toolbar>=4.4.6,<5",
    "django-watchfiles>=0.2.0,<1",
    "django-autocomplete-light>=3.9.4,<4",
    "django-phonenumber-field[phonenumberslite]>=6.3.0,<7",
    "requests>=2.31.0,<3",
    "beautifulsoup4>=4.12.1,<5",
    "django-editorjs>=0.2.1,<1",
    "django-editorjs-fields>=0.2.7,<1",
    "django-mptt>=0.16.0,<1",
    # TODO: when bumped to 1.14.4, urls are broken with 404s
    "django-storages[s3]==1.14.2",
    "dj-database-url>=2.0.0,<3",
    "django-health-check>=3.17.0,<4",
    "django-money>=3.2.0,<4",
    "gunicorn>=23.0.0,<24",
    "django-location-field>=2.7.2,<3",
    "sentry-sdk[django]>=2.14.0,<3",
    "django-admin-env-notice>=1.0,<2",
    "cryptography>=43.0.0,<44",
    "django-admin-relation-links>=0.2.5,<1",
    "django-mailer>=2.3.1,<3",
    "django-recaptcha>=4.0.0,<5",
]

[dependency-groups]
dev = [
    "pre-commit>=2.17.0,<3",
    "pydotplus>=2.0.2,<3",
    "pydot>=1.4.2,<2",
]

[tool.isort]
profile = 'black'
lines_between_types = 0
combine_as_imports = true
line_length = 120
known_first_party = ["fiesta", "apps"]
known_local_folder = ["apps"]
known_third_party = ["django"]
skip = ["migrations"]

[tool.black]
line-length = 120
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | migrations
  | build
  | dist
)/
'''

[tool.ruff]
# see https://beta.ruff.rs/docs/rules/
line-length = 120
target-version = "py311"

exclude = [
    "migrations",
]

lint.ignore = ["E731"]
extend-select = ["UP", "DJ", "PIE", "INT", "PTH", "SIM", "RET", "G", "DTZ", "B", "I002"]
lint.isort.required-imports = ["from __future__ import annotations"]


[tool.vulture]
paths = ["fiesta"]
exclude = ["settings"]
min_confidence = 80
make_whitelist = true

[tool.djlint]
profile = "django"
reformat = true
ignore = ["H017"]
indent = 2
blank_line_after_tag = ""
blank_line_before_tag = ""
format_attribute_template_tags = true
preserve_blank_lines = true
