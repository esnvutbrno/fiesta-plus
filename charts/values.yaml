ingress:
  certSecretName: fiesta-cert

  certIssuerName: scaleway
  certIssuerSecretName: cert-issuer-key
  dnsWebhookSecretName: scaleway-dns

  certContactEmail: dummy@example.com

  host: fiesta.plus
  extraHosts:
    - "*.fiesta.plus"

web:
  repository: nginxdemos/hello
  tag: latest

  configName: web-config
  secretName: web-secret

  port: 8000

  emailDomain: mail.fiesta.plus

proxy:
  repository: nginxdemos/hello
  tag: latest

  port: 80

secrets:
  databaseUrl: postgres
  s3:
    keyId: key
    accessKey: key
    regionName: region
    bucketName: bucket
  dnsWebhook:
    accessKey: key
    secretKey: key
  sentry:
    dsn: dsn
    jsLoaderUrl: url
  recaptcha:
    siteKey: key
    secretKey: key
  mailer:
    primary:
      host: host
      port: 587
      user: user
      password: password
